# Apolo: children=1→8 means more workers can hold TCP/TLS/WSS connections in
# parallel; the packaged unit inherits the system default of 1024 open files
# per process, which a burst of concurrent carrier/PBX TCP or WSS clients
# could exhaust well before the 524288 hard limit the system actually allows.
[Service]
LimitNOFILE=65536

# Apolo: Kamailio runs standalone from /etc/kamailio/kamailio.cfg (see
# detach_from_dsiprouter in scripts/install_server.sh). The stock unit calls
# `dsiprouter chown` and toggles chattr on /etc/dsiprouter/kamailio/*.cfg on
# every start; clear those so Kamailio no longer depends on the dsiprouter CLI.
ExecStartPre=
ExecStartPost=
