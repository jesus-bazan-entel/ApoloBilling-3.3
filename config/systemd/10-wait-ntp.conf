# Apolo: start only after the clock is NTP-synchronized (time-sync.target).
# On 2026-11-26 the VM booted with its RTC ~5 h ahead; for ~35 s services
# wrote samples/rows stamped in the future (monitoring charts, alerts).
# systemd-time-wait-sync is capped at 60 s (see 10-timeout.conf), so a dead
# NTP server delays the boot by at most 60 s instead of blocking it.
[Unit]
Wants=time-sync.target
After=time-sync.target
