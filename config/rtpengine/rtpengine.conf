[rtpengine]
table = 0
no-fallback = false
# Interfaces: internal=LAN (talks to FS), external=media-public (toward carrier)
# The installer rewrites these to INTERNAL_IP_ADDR (LAN) and PUBLIC_MEDIA_IP.
interface = internal/10.118.0.6;external/10.124.193.169
listen-ng = 127.0.0.1:7722
listen-cli = 127.0.0.1:9900

port-min = 10000
port-max = 20000
num-threads = 8
timeout = 60
silent-timeout = 3600
offer-timeout = 300
#final-timeout = 7200
#tos = 184
#control-tos = 184
#delete-delay = 30
#final-timeout = 10800
#homer = 123.234.345.456:9060
#homer-protocol = udp
#homer-id = 1
#sip-source = false
#dtls-passive = false
log-level = 4
log-stderr = false
log-facility = local1
log-facility-cdr = local1
log-facility-rtcp = local1
