# Apolo: drop dSIPRouter leftovers from the packaged rtpengine.service.
# The stock unit does `chattr -i/+i /etc/dsiprouter/rtpengine/rtpengine.conf`
# and `dsiprouter chown -rtpengine` on every start/stop. Kamailio + RTPEngine
# run standalone here (see detach_from_dsiprouter in scripts/install_server.sh)
# with CONFIG_FILE=/etc/rtpengine/rtpengine.conf, so those ExecStartPre/Post
# lines only touch an orphan dsiprouter-owned file. Clearing them keeps the
# iptables/kernel-table setup (needed for table >= 0) and drops the rest.
# Survives `ngcp-rtpengine` package upgrades (drop-in, not editing /lib).
[Service]
ExecStartPre=
ExecStartPre=+/usr/sbin/ngcp-rtpengine-iptables-setup start
ExecStartPost=
ExecStopPre=
ExecStopPost=+/usr/sbin/ngcp-rtpengine-iptables-setup stop
# Post-start self-check (never fails the service, see `+-` prefix): the
# packaged setup script hides all iptables errors (2>/dev/null), so a missing
# kernel rule would otherwise go unnoticed while the daemon silently falls
# back to userspace (no-fallback = false). Logs WARNINGs to the journal when
# table >= 0 but module, /proc table, or the legacy iptables rule is missing.
# Watch with:
#   journalctl -u rtpengine --since "5 min ago" | grep -i "WARNING\|kernel forwarding"
# Requires the `iptables`/`ip6tables` CLIs pinned to legacy (see installer):
# xt_RTPENGINE is an xtables extension and plain `iptables -L/-C` cannot
# inspect its rules under the nft backend.
ExecStartPost=+-/usr/local/sbin/rtpengine-kernel-check
